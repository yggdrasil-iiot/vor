# Unit tests on Linux and Windows (hash-pinned fixtures must survive both checkouts), plus the ASCII
# product-name check. scripts/vor_gate.py stands up HiveMQ CE, the Bifrost sim and Muninn, so it is
# not run here; a red badge should mean a regression, not a container that did not come up. Run it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - name: Product names in ASCII
        if: runner.os == 'Linux'
        run: bash scripts/check-ascii-names.sh
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # The gates are not run here, so nothing else would notice a gate script that no longer parses.
      - name: Gate scripts compile
        run: python -m compileall -q scripts
      - name: Test
        run: python -m pytest -q
