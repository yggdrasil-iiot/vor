[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vor"
version = "0.1.0"
description = "Governed reader: one value bound to a signed Bifrost release and live Sparkplug B data, or a refusal"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.2,<2",
    "paho-mqtt>=2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
gate = ["asyncua>=1.1"]

[project.scripts]
vor = "vor.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
